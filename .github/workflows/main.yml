name: Deploy Project Management

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: futurex-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Configure verified SSH host
        shell: bash
        run: |
          set -euo pipefail
          : "${VPS_HOST:?}" "${VPS_USER:?}" "${VPS_SSH_KEY:?}" "${VPS_KNOWN_HOSTS:?}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Upload source preserving persistent data
        shell: bash
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]]
          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key -p $port" \
            --exclude=".git" --exclude=".github" --exclude="node_modules" \
            --exclude=".next" --exclude=".next-dev" --exclude="dist" \
            --exclude=".env*" --exclude="uploads" --exclude="*.log" \
            ./ "$VPS_USER@$VPS_HOST:/var/www/project-management/"

      - name: Verify configuration, test, build and restart
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /var/www/project-management
          test -f backend/.env
          test -f frontend/.env.production
          export NODE_ENV=production
          export NEXT_TELEMETRY_DISABLED=1
          corepack pnpm install --frozen-lockfile --prod=false
          cd backend
          corepack pnpm exec prisma generate
          corepack pnpm run typecheck
          corepack pnpm test -- --runInBand
          corepack pnpm run build
          # Fail before restarting if production authentication settings are unsafe.
          node -r dotenv/config -e "require('./dist/common/security/http-security').validateSecurityEnvironment(); const s=require('./dist/modules/auth/auth-secrets'); s.getJwtAccessSecret(); s.getJwtRefreshSecret();"
          # Existing db-push installations must be baselined before enabling migrations.
          corepack pnpm exec prisma migrate deploy
          cd ../frontend
          corepack pnpm run build
          test -f .next/BUILD_ID
          cd ..
          pm2 startOrReload deploy/ecosystem.config.cjs --env production
          pm2 save
          curl --fail --silent http://127.0.0.1:5040/api/v1/health
          curl --fail --silent --output /dev/null http://127.0.0.1:3040/login
          REMOTE

      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/deploy_key
