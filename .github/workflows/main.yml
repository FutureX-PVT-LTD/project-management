name: Deploy Project Management

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: project-management-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout GitHub source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # SSH
      # ============================================================

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          SSH_PORT="${{ secrets.VPS_PORT }}"

          if [ -z "$SSH_PORT" ]; then
            SSH_PORT="22"
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan \
            -H \
            -p "$SSH_PORT" \
            "${{ secrets.VPS_HOST }}" \
            >> ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts


      - name: Test server connection
        shell: bash
        run: |
          set -euo pipefail

          SSH_PORT="${{ secrets.VPS_PORT }}"

          if [ -z "$SSH_PORT" ]; then
            SSH_PORT="22"
          fi

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "echo 'SSH connection successful' && hostname && ls -la /var/www/project-management"


      # ============================================================
      # UPLOAD GITHUB SOURCE
      # ============================================================

      - name: Upload GitHub source to server
        shell: bash
        run: |
          set -euo pipefail

          SSH_PORT="${{ secrets.VPS_PORT }}"

          if [ -z "$SSH_PORT" ]; then
            SSH_PORT="22"
          fi

          echo "Uploading GitHub source..."

          rsync \
            -az \
            --delete \
            --delete-delay \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            \
            --exclude=".git" \
            --exclude=".github" \
            \
            --exclude="node_modules" \
            --exclude="backend/node_modules" \
            --exclude="frontend/node_modules" \
            \
            --exclude="backend/dist" \
            --exclude="frontend/.next" \
            \
            --exclude=".env" \
            --exclude=".env.*" \
            --exclude="backend/.env" \
            --exclude="backend/.env.*" \
            --exclude="frontend/.env" \
            --exclude="frontend/.env.local" \
            --exclude="frontend/.env.production" \
            \
            --exclude="uploads" \
            --exclude="backend/uploads" \
            \
            --exclude="logs" \
            --exclude="*.log" \
            \
            ./ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/project-management/"

          echo "Source upload completed."


      # ============================================================
      # SAVE DEPLOY COMMIT
      # ============================================================

      - name: Write deployment version
        shell: bash
        run: |
          set -euo pipefail

          SSH_PORT="${{ secrets.VPS_PORT }}"

          if [ -z "$SSH_PORT" ]; then
            SSH_PORT="22"
          fi

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "printf '%s\n' '${{ github.sha }}' > /var/www/project-management/DEPLOY_SHA_PENDING"


      # ============================================================
      # BUILD + DEPLOY
      # ============================================================

      - name: Build and deploy on server
        shell: bash
        run: |
          set -euo pipefail

          SSH_PORT="${{ secrets.VPS_PORT }}"

          if [ -z "$SSH_PORT" ]; then
            SSH_PORT="22"
          fi

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'

            set -euo pipefail

            # ======================================================
            # PATHS
            # ======================================================

            PROJECT_DIR="/var/www/project-management"
            BACKEND_DIR="$PROJECT_DIR/backend"
            FRONTEND_DIR="$PROJECT_DIR/frontend"

            export CI=true
            export NODE_ENV=production


            echo ""
            echo "======================================"
            echo " PROJECT MANAGEMENT DEPLOYMENT"
            echo "======================================"
            echo ""


            # ======================================================
            # RUNTIME
            # ======================================================

            echo "======================================"
            echo " Runtime"
            echo "======================================"

            node -v
            npm -v

            corepack enable

            corepack prepare pnpm@10.33.2 --activate

            echo "pnpm:"
            pnpm -v


            # ======================================================
            # CHECK FILE STRUCTURE
            # ======================================================

            echo ""
            echo "======================================"
            echo " Checking project structure"
            echo "======================================"

            test -d "$PROJECT_DIR"
            test -d "$BACKEND_DIR"
            test -d "$FRONTEND_DIR"

            test -f "$PROJECT_DIR/package.json" || {
              echo "ERROR: root package.json missing"
              exit 1
            }

            test -f "$BACKEND_DIR/package.json" || {
              echo "ERROR: backend/package.json missing"
              exit 1
            }

            test -f "$FRONTEND_DIR/package.json" || {
              echo "ERROR: frontend/package.json missing"
              exit 1
            }


            # ======================================================
            # ENV FILES
            # ======================================================

            echo ""
            echo "======================================"
            echo " Checking production env files"
            echo "======================================"

            if [ ! -f "$BACKEND_DIR/.env" ]; then
              echo "ERROR: $BACKEND_DIR/.env missing"
              exit 1
            fi

            if [ ! -f "$FRONTEND_DIR/.env.production" ]; then
              echo "ERROR: $FRONTEND_DIR/.env.production missing"
              exit 1
            fi

            echo "Production env files found."


            # ======================================================
            # INSTALL DEPENDENCIES
            # ======================================================

            echo ""
            echo "======================================"
            echo " Install dependencies"
            echo "======================================"

            cd "$PROJECT_DIR"

            export CI=true

            pnpm install --frozen-lockfile


            # ======================================================
            # PRISMA
            # ======================================================

            echo ""
            echo "======================================"
            echo " Prisma"
            echo "======================================"

            cd "$BACKEND_DIR"

            echo "Generating Prisma client..."
            pnpm exec prisma generate


            # ======================================================
            # OPTIONAL MIGRATION PREFLIGHT
            # ======================================================

            if [ -f "$BACKEND_DIR/scripts/migration-preflight.cjs" ]; then

              echo ""
              echo "Running migration preflight..."

              node "$BACKEND_DIR/scripts/migration-preflight.cjs"

            else

              echo "migration-preflight.cjs not found - skipping preflight."

            fi


            # ======================================================
            # DATABASE MIGRATIONS
            # ======================================================

            echo ""
            echo "======================================"
            echo " Production database migrations"
            echo "======================================"

            # NEVER use:
            # prisma migrate reset
            # prisma db push --accept-data-loss
            # prisma db seed

            pnpm exec prisma migrate deploy

            echo "Prisma migrations completed."


            # ======================================================
            # BACKEND BUILD
            # ======================================================

            echo ""
            echo "======================================"
            echo " Build backend"
            echo "======================================"

            cd "$BACKEND_DIR"

            rm -rf dist

            pnpm run build

            MAIN_FILE=$(find dist -type f -name "main.js" | head -n 1)

            if [ -z "$MAIN_FILE" ]; then
              echo "ERROR: Backend main.js not found."
              exit 1
            fi

            echo "Backend entry file:"
            echo "$MAIN_FILE"


            # ======================================================
            # FRONTEND BUILD
            # ======================================================

            echo ""
            echo "======================================"
            echo " Build frontend"
            echo "======================================"

            cd "$FRONTEND_DIR"

            rm -rf .next

            export API_URL="http://127.0.0.1:5040"
            export NEXT_PUBLIC_APP_URL="https://projects.futurex.lk"
            export NEXT_TELEMETRY_DISABLED="1"

            # VPS has limited RAM.
            export NODE_OPTIONS="--max-old-space-size=1024"

            pnpm run build

            if [ ! -f "$FRONTEND_DIR/.next/BUILD_ID" ]; then
              echo "ERROR: Frontend build failed. .next/BUILD_ID missing."
              exit 1
            fi

            echo "Frontend build completed."


            # ======================================================
            # RESTART BACKEND
            # ======================================================

            echo ""
            echo "======================================"
            echo " Restart backend"
            echo "======================================"

            cd "$BACKEND_DIR"

            MAIN_FILE=$(find dist -type f -name "main.js" | head -n 1)

            pm2 delete project-management-api 2>/dev/null || true

            NODE_ENV=production \
            PORT=5040 \
            pm2 start "$MAIN_FILE" \
              --name project-management-api \
              --cwd "$BACKEND_DIR" \
              --update-env


            # ======================================================
            # BACKEND HEALTH CHECK
            # ======================================================

            echo ""
            echo "======================================"
            echo " Waiting for backend"
            echo "======================================"

            BACKEND_OK="false"

            for ATTEMPT in $(seq 1 20); do

              echo "Backend health attempt $ATTEMPT/20..."

              if curl \
                --silent \
                --show-error \
                --fail \
                --max-time 5 \
                http://127.0.0.1:5040/api/v1/health \
                > /dev/null; then

                BACKEND_OK="true"

                echo "Backend is healthy."

                break
              fi

              sleep 3

            done


            if [ "$BACKEND_OK" != "true" ]; then

              echo ""
              echo "ERROR: Backend failed to become healthy."
              echo ""

              echo "========== PM2 =========="
              pm2 list || true

              echo ""
              echo "========== PORT 5040 =========="
              ss -ltnp | grep ':5040' || true

              echo ""
              echo "========== BACKEND LOGS =========="
              pm2 logs project-management-api \
                --lines 120 \
                --nostream || true

              exit 1

            fi


            # ======================================================
            # RESTART FRONTEND
            # ======================================================

            echo ""
            echo "======================================"
            echo " Restart frontend"
            echo "======================================"

            pm2 delete project-management-frontend 2>/dev/null || true

            API_URL=http://127.0.0.1:5040 \
            NODE_ENV=production \
            pm2 start "$FRONTEND_DIR/node_modules/next/dist/bin/next" \
              --name project-management-frontend \
              --cwd "$FRONTEND_DIR" \
              -- start \
              -p 3040 \
              -H 127.0.0.1


            # ======================================================
            # FRONTEND HEALTH CHECK
            # ======================================================

            echo ""
            echo "======================================"
            echo " Waiting for frontend"
            echo "======================================"

            FRONTEND_OK="false"

            for ATTEMPT in $(seq 1 20); do

              echo "Frontend health attempt $ATTEMPT/20..."

              if curl \
                --silent \
                --show-error \
                --fail \
                --head \
                --max-time 5 \
                http://127.0.0.1:3040 \
                > /dev/null; then

                FRONTEND_OK="true"

                echo "Frontend is healthy."

                break
              fi

              sleep 3

            done


            if [ "$FRONTEND_OK" != "true" ]; then

              echo ""
              echo "ERROR: Frontend failed to become healthy."
              echo ""

              echo "========== PM2 =========="
              pm2 list || true

              echo ""
              echo "========== PORT 3040 =========="
              ss -ltnp | grep ':3040' || true

              echo ""
              echo "========== FRONTEND LOGS =========="
              pm2 logs project-management-frontend \
                --lines 120 \
                --nostream || true

              exit 1

            fi


            # ======================================================
            # PM2 SAVE
            # ======================================================

            echo ""
            echo "======================================"
            echo " Save PM2"
            echo "======================================"

            pm2 save


            # ======================================================
            # NGINX
            # ======================================================

            echo ""
            echo "======================================"
            echo " Nginx"
            echo "======================================"

            nginx -t

            systemctl reload nginx


            # ======================================================
            # DOMAIN HEALTH CHECK
            # ======================================================

            echo ""
            echo "======================================"
            echo " Public domain health check"
            echo "======================================"

            DOMAIN_OK="false"

            for ATTEMPT in $(seq 1 10); do

              echo "Domain health attempt $ATTEMPT/10..."

              if curl \
                --silent \
                --show-error \
                --fail \
                --head \
                --max-time 10 \
                https://projects.futurex.lk \
                > /dev/null; then

                DOMAIN_OK="true"

                echo "Public website is healthy."

                break
              fi

              sleep 3

            done


            if [ "$DOMAIN_OK" != "true" ]; then

              echo ""
              echo "ERROR: Public domain health check failed."
              echo ""

              echo "========== NGINX =========="
              nginx -t || true

              echo ""
              echo "========== PM2 =========="
              pm2 list || true

              exit 1

            fi


            # ======================================================
            # PUBLIC API HEALTH CHECK
            # ======================================================

            echo ""
            echo "======================================"
            echo " Public API health check"
            echo "======================================"

            curl \
              --silent \
              --show-error \
              --fail \
              --max-time 10 \
              https://projects.futurex.lk/api/v1/health


            # ======================================================
            # DEPLOY VERSION
            # ======================================================

            if [ -f "$PROJECT_DIR/DEPLOY_SHA_PENDING" ]; then

              mv \
                "$PROJECT_DIR/DEPLOY_SHA_PENDING" \
                "$PROJECT_DIR/DEPLOY_SHA"

            fi

            date -u +"%Y-%m-%dT%H:%M:%SZ" \
              > "$PROJECT_DIR/DEPLOY_TIME"


            # ======================================================
            # COMPLETE
            # ======================================================

            echo ""
            echo "======================================"
            echo " DEPLOYMENT SUCCESSFUL"
            echo "======================================"

            echo "Frontend:"
            echo "https://projects.futurex.lk"

            echo ""

            echo "API:"
            echo "https://projects.futurex.lk/api/v1"

            echo ""

            echo "Deploy SHA:"
            cat "$PROJECT_DIR/DEPLOY_SHA" 2>/dev/null || true

            echo ""

            echo "Deploy time:"
            cat "$PROJECT_DIR/DEPLOY_TIME" 2>/dev/null || true

            echo "======================================"

          EOF


      # ============================================================
      # CLEAN TEMP SSH KEY
      # ============================================================

      - name: Remove temporary SSH key
        if: always()
        shell: bash
        run: |
          rm -f ~/.ssh/deploy_key