name: Deploy Project Management

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub source
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          set -e

          SSH_PORT="${{ secrets.VPS_PORT }}"
          if [ -z "$SSH_PORT" ]; then
            SSH_PORT=22
          fi

          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H \
            -p "$SSH_PORT" \
            "${{ secrets.VPS_HOST }}" \
            >> ~/.ssh/known_hosts

      - name: Test server connection
        run: |
          set -e

          SSH_PORT="${{ secrets.VPS_PORT }}"
          if [ -z "$SSH_PORT" ]; then
            SSH_PORT=22
          fi

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "echo 'SSH OK' && ls -la /var/www/project-management"

      - name: Upload GitHub source to server
        run: |
          set -e

          SSH_PORT="${{ secrets.VPS_PORT }}"
          if [ -z "$SSH_PORT" ]; then
            SSH_PORT=22
          fi

          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules" \
            --exclude="backend/node_modules" \
            --exclude="frontend/node_modules" \
            --exclude="backend/dist" \
            --exclude="frontend/.next" \
            --exclude=".env" \
            --exclude="backend/.env" \
            --exclude="frontend/.env" \
            --exclude="frontend/.env.local" \
            --exclude="frontend/.env.production" \
            --exclude="uploads" \
            --exclude="backend/uploads" \
            --exclude="logs" \
            --exclude="*.log" \
            ./ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/project-management/

      - name: Build and deploy on server
        run: |
          set -e

          SSH_PORT="${{ secrets.VPS_PORT }}"
          if [ -z "$SSH_PORT" ]; then
            SSH_PORT=22
          fi

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'

            set -e

            PROJECT_DIR="/var/www/project-management"
            BACKEND_DIR="$PROJECT_DIR/backend"
            FRONTEND_DIR="$PROJECT_DIR/frontend"

            echo "=============================="
            echo " Runtime"
            echo "=============================="

            node -v
            npm -v

            corepack enable
            corepack prepare pnpm@12.3.4 --activate
            pnpm -v

            echo "=============================="
            echo " Checking server env files"
            echo "=============================="

            if [ ! -f "$BACKEND_DIR/.env" ]; then
              echo "ERROR: backend/.env missing"
              exit 1
            fi

            if [ ! -f "$FRONTEND_DIR/.env.production" ]; then
              echo "ERROR: frontend/.env.production missing"
              exit 1
            fi

            echo "=============================="
            echo " Install dependencies"
            echo "=============================="

            cd "$PROJECT_DIR"
            pnpm install --frozen-lockfile

            echo "=============================="
            echo " Prisma"
            echo "=============================="

            cd "$BACKEND_DIR"

            pnpm exec prisma generate

            # Production migrations only.
            # NEVER seed/reset automatically here.
            pnpm exec prisma migrate deploy

            echo "=============================="
            echo " Build backend"
            echo "=============================="

            cd "$BACKEND_DIR"

            rm -rf dist
            pnpm run build

            MAIN_FILE=$(find dist -type f -name "main.js" | head -n 1)

            if [ -z "$MAIN_FILE" ]; then
              echo "ERROR: backend main.js not found"
              exit 1
            fi

            echo "Backend entry: $MAIN_FILE"

            echo "=============================="
            echo " Build frontend"
            echo "=============================="

            cd "$FRONTEND_DIR"

            rm -rf .next

            export API_URL="http://127.0.0.1:5040"
            export NEXT_PUBLIC_APP_URL="https://projects.futurex.lk"
            export NEXT_TELEMETRY_DISABLED=1
            export NODE_OPTIONS="--max-old-space-size=1024"

            pnpm run build

            if [ ! -f ".next/BUILD_ID" ]; then
              echo "ERROR: frontend build failed - BUILD_ID missing"
              exit 1
            fi

            echo "=============================="
            echo " Restart backend"
            echo "=============================="

            cd "$BACKEND_DIR"

            MAIN_FILE=$(find dist -type f -name "main.js" | head -n 1)

            pm2 delete project-management-api 2>/dev/null || true

            PORT=5040 \
            NODE_ENV=production \
            pm2 start "$MAIN_FILE" \
              --name project-management-api \
              --cwd "$BACKEND_DIR" \
              --update-env

            echo "=============================="
            echo " Restart frontend"
            echo "=============================="

            pm2 delete project-management-frontend 2>/dev/null || true

            API_URL=http://127.0.0.1:5040 \
            pm2 start "$FRONTEND_DIR/node_modules/next/dist/bin/next" \
              --name project-management-frontend \
              --cwd "$FRONTEND_DIR" \
              -- start -p 3040 -H 127.0.0.1

            pm2 save

            echo "=============================="
            echo " Nginx"
            echo "=============================="

            nginx -t
            systemctl reload nginx

            echo "=============================="
            echo " Health checks"
            echo "=============================="

            sleep 5

            curl -fsS \
              http://127.0.0.1:5040/api/v1/health \
              > /dev/null

            curl -fsSI \
              http://127.0.0.1:3040 \
              > /dev/null

            curl -fsSI \
              https://projects.futurex.lk \
              > /dev/null

            echo ""
            echo "======================================"
            echo " DEPLOYMENT SUCCESSFUL"
            echo " https://projects.futurex.lk"
            echo "======================================"

          EOF