name: Deploy Project Management

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: project-management-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ==========================================================
      # CHECKOUT
      # ==========================================================
      - name: Checkout GitHub source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ==========================================================
      # SSH SETUP
      # ==========================================================
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          SSH_PORT="${{ secrets.VPS_PORT }}"

          if [ -z "$SSH_PORT" ]; then
            SSH_PORT="22"
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan \
            -H \
            -p "$SSH_PORT" \
            "${{ secrets.VPS_HOST }}" \
            >> ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts

      # ==========================================================
      # TEST SSH
      # ==========================================================
      - name: Test server connection
        shell: bash
        run: |
          set -euo pipefail

          SSH_PORT="${{ secrets.VPS_PORT }}"

          if [ -z "$SSH_PORT" ]; then
            SSH_PORT="22"
          fi

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "echo 'SSH connection successful' && hostname && ls -la /var/www/project-management"

      # ==========================================================
      # UPLOAD SOURCE
      # ==========================================================
      - name: Upload GitHub source to server
        shell: bash
        run: |
          set -euo pipefail

          SSH_PORT="${{ secrets.VPS_PORT }}"

          if [ -z "$SSH_PORT" ]; then
            SSH_PORT="22"
          fi

          echo "Uploading latest GitHub source..."

          rsync \
            -az \
            --delete \
            --delete-delay \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules" \
            --exclude="backend/node_modules" \
            --exclude="frontend/node_modules" \
            --exclude="backend/dist" \
            --exclude="frontend/.next" \
            --exclude=".env" \
            --exclude=".env.*" \
            --exclude="backend/.env" \
            --exclude="backend/.env.*" \
            --exclude="frontend/.env" \
            --exclude="frontend/.env.local" \
            --exclude="frontend/.env.production" \
            --exclude="uploads" \
            --exclude="backend/uploads" \
            --exclude="logs" \
            --exclude="*.log" \
            ./ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/project-management/"

          echo "Upload completed."

      # ==========================================================
      # DEPLOY SHA
      # ==========================================================
      - name: Write pending deployment version
        shell: bash
        run: |
          set -euo pipefail

          SSH_PORT="${{ secrets.VPS_PORT }}"

          if [ -z "$SSH_PORT" ]; then
            SSH_PORT="22"
          fi

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "printf '%s\n' '${{ github.sha }}' > /var/www/project-management/DEPLOY_SHA_PENDING"

      # ==========================================================
      # BUILD + DEPLOY
      # ==========================================================
      - name: Build and deploy on server
        shell: bash
        run: |
          set -euo pipefail

          SSH_PORT="${{ secrets.VPS_PORT }}"

          if [ -z "$SSH_PORT" ]; then
            SSH_PORT="22"
          fi

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'

            set -euo pipefail

            PROJECT_DIR="/var/www/project-management"
            BACKEND_DIR="$PROJECT_DIR/backend"
            FRONTEND_DIR="$PROJECT_DIR/frontend"

            export CI=true
            export NODE_ENV=production

            echo ""
            echo "======================================"
            echo " PROJECT MANAGEMENT DEPLOYMENT"
            echo "======================================"

            # ====================================================
            # RUNTIME
            # ====================================================
            echo ""
            echo "======================================"
            echo " Runtime"
            echo "======================================"

            node -v
            npm -v

            corepack enable
            corepack prepare pnpm@10.33.2 --activate

            echo "pnpm version:"
            pnpm -v

            # ====================================================
            # CHECK PROJECT STRUCTURE
            # ====================================================
            echo ""
            echo "======================================"
            echo " Check project structure"
            echo "======================================"

            test -d "$PROJECT_DIR"
            test -d "$BACKEND_DIR"
            test -d "$FRONTEND_DIR"

            if [ ! -f "$PROJECT_DIR/package.json" ]; then
              echo "ERROR: root package.json missing"
              exit 1
            fi

            if [ ! -f "$BACKEND_DIR/package.json" ]; then
              echo "ERROR: backend package.json missing"
              exit 1
            fi

            if [ ! -f "$FRONTEND_DIR/package.json" ]; then
              echo "ERROR: frontend package.json missing"
              exit 1
            fi

            # ====================================================
            # CHECK ENV FILES
            # ====================================================
            echo ""
            echo "======================================"
            echo " Check production env files"
            echo "======================================"

            if [ ! -f "$BACKEND_DIR/.env" ]; then
              echo "ERROR: backend/.env missing"
              exit 1
            fi

            if [ ! -f "$FRONTEND_DIR/.env.production" ]; then
              echo "ERROR: frontend/.env.production missing"
              exit 1
            fi

            echo "Production env files found."

            # ====================================================
            # INSTALL DEPENDENCIES
            # ====================================================
            echo ""
            echo "======================================"
            echo " Install dependencies"
            echo "======================================"

            cd "$PROJECT_DIR"

            export CI=true

            pnpm install --frozen-lockfile

            # ====================================================
            # PRISMA
            # ====================================================
            echo ""
            echo "======================================"
            echo " Prisma"
            echo "======================================"

            cd "$BACKEND_DIR"

            echo "Generating Prisma Client..."
            pnpm exec prisma generate

            echo ""
            echo "Current migration status:"
            pnpm exec prisma migrate status || true

            echo ""
            echo "Applying production migrations..."

            # IMPORTANT:
            # No migrate reset
            # No seed
            # No db push --accept-data-loss
            pnpm exec prisma migrate deploy

            echo "Prisma migrations completed."

            # ====================================================
            # BACKEND BUILD
            # ====================================================
            echo ""
            echo "======================================"
            echo " Build backend"
            echo "======================================"

            cd "$BACKEND_DIR"

            rm -rf dist

            pnpm run build

            MAIN_FILE=$(find dist -type f -name "main.js" | head -n 1)

            if [ -z "$MAIN_FILE" ]; then
              echo "ERROR: backend main.js not found"
              exit 1
            fi

            echo "Backend entry:"
            echo "$MAIN_FILE"

            # ====================================================
            # FRONTEND BUILD
            # ====================================================
            echo ""
            echo "======================================"
            echo " Build frontend"
            echo "======================================"

            cd "$FRONTEND_DIR"

            rm -rf .next

            export API_URL="http://127.0.0.1:5040"
            export NEXT_PUBLIC_APP_URL="https://projects.futurex.lk"
            export NEXT_TELEMETRY_DISABLED="1"

            # 1 GB RAM VPS
            export NODE_OPTIONS="--max-old-space-size=1024"

            pnpm run build

            if [ ! -f "$FRONTEND_DIR/.next/BUILD_ID" ]; then
              echo "ERROR: frontend .next/BUILD_ID missing"
              exit 1
            fi

            echo "Frontend build completed."

            # ====================================================
            # RESTART BACKEND
            # ====================================================
            echo ""
            echo "======================================"
            echo " Restart backend"
            echo "======================================"

            cd "$BACKEND_DIR"

            MAIN_FILE=$(find dist -type f -name "main.js" | head -n 1)

            pm2 delete project-management-api 2>/dev/null || true

            NODE_ENV=production \
            PORT=5040 \
            pm2 start "$MAIN_FILE" \
              --name project-management-api \
              --cwd "$BACKEND_DIR" \
              --update-env

            # ====================================================
            # WAIT FOR BACKEND
            # ====================================================
            echo ""
            echo "======================================"
            echo " Waiting for backend"
            echo "======================================"

            BACKEND_OK=false

            for ATTEMPT in $(seq 1 20); do
              echo "Backend health attempt $ATTEMPT/20..."

              if curl \
                --silent \
                --show-error \
                --fail \
                --max-time 5 \
                http://127.0.0.1:5040/api/v1/health \
                > /dev/null; then

                BACKEND_OK=true
                echo "Backend is healthy."
                break
              fi

              sleep 3
            done

            if [ "$BACKEND_OK" != "true" ]; then
              echo ""
              echo "ERROR: Backend failed to start."

              echo ""
              echo "========== PM2 STATUS =========="
              pm2 list || true

              echo ""
              echo "========== PORT 5040 =========="
              ss -ltnp | grep ':5040' || true

              echo ""
              echo "========== BACKEND LOGS =========="
              pm2 logs project-management-api \
                --lines 150 \
                --nostream || true

              exit 1
            fi

            # ====================================================
            # RESTART FRONTEND
            # ====================================================
            echo ""
            echo "======================================"
            echo " Restart frontend"
            echo "======================================"

            pm2 delete project-management-frontend 2>/dev/null || true

            NODE_ENV=production \
            API_URL=http://127.0.0.1:5040 \
            pm2 start "$FRONTEND_DIR/node_modules/next/dist/bin/next" \
              --name project-management-frontend \
              --cwd "$FRONTEND_DIR" \
              -- start \
              -p 3040 \
              -H 127.0.0.1

            # ====================================================
            # WAIT FOR FRONTEND
            # ====================================================
            echo ""
            echo "======================================"
            echo " Waiting for frontend"
            echo "======================================"

            FRONTEND_OK=false

            for ATTEMPT in $(seq 1 20); do
              echo "Frontend health attempt $ATTEMPT/20..."

              if curl \
                --silent \
                --show-error \
                --fail \
                --head \
                --max-time 5 \
                http://127.0.0.1:3040 \
                > /dev/null; then

                FRONTEND_OK=true
                echo "Frontend is healthy."
                break
              fi

              sleep 3
            done

            if [ "$FRONTEND_OK" != "true" ]; then
              echo ""
              echo "ERROR: Frontend failed to start."

              echo ""
              echo "========== PM2 STATUS =========="
              pm2 list || true

              echo ""
              echo "========== PORT 3040 =========="
              ss -ltnp | grep ':3040' || true

              echo ""
              echo "========== FRONTEND LOGS =========="
              pm2 logs project-management-frontend \
                --lines 150 \
                --nostream || true

              exit 1
            fi

            # ====================================================
            # SAVE PM2
            # ====================================================
            echo ""
            echo "======================================"
            echo " Save PM2"
            echo "======================================"

            pm2 save

            # ====================================================
            # NGINX
            # ====================================================
            echo ""
            echo "======================================"
            echo " Nginx"
            echo "======================================"

            nginx -t
            systemctl reload nginx

            # ====================================================
            # PUBLIC WEBSITE CHECK
            # ====================================================
            echo ""
            echo "======================================"
            echo " Public website health"
            echo "======================================"

            DOMAIN_OK=false

            for ATTEMPT in $(seq 1 10); do
              echo "Domain health attempt $ATTEMPT/10..."

              if curl \
                --silent \
                --show-error \
                --fail \
                --head \
                --max-time 10 \
                https://projects.futurex.lk \
                > /dev/null; then

                DOMAIN_OK=true
                echo "Public website is healthy."
                break
              fi

              sleep 3
            done

            if [ "$DOMAIN_OK" != "true" ]; then
              echo ""
              echo "ERROR: Public domain failed health check."

              nginx -t || true
              pm2 list || true

              exit 1
            fi

            # ====================================================
            # PUBLIC API CHECK
            # ====================================================
            echo ""
            echo "======================================"
            echo " Public API health"
            echo "======================================"

            curl \
              --silent \
              --show-error \
              --fail \
              --max-time 10 \
              https://projects.futurex.lk/api/v1/health

            # ====================================================
            # DEPLOY VERSION
            # ====================================================
            if [ -f "$PROJECT_DIR/DEPLOY_SHA_PENDING" ]; then
              mv \
                "$PROJECT_DIR/DEPLOY_SHA_PENDING" \
                "$PROJECT_DIR/DEPLOY_SHA"
            fi

            date -u +"%Y-%m-%dT%H:%M:%SZ" \
              > "$PROJECT_DIR/DEPLOY_TIME"

            # ====================================================
            # DONE
            # ====================================================
            echo ""
            echo "======================================"
            echo " DEPLOYMENT SUCCESSFUL"
            echo "======================================"

            echo "Frontend:"
            echo "https://projects.futurex.lk"

            echo ""
            echo "API:"
            echo "https://projects.futurex.lk/api/v1"

            echo ""
            echo "Deploy SHA:"
            cat "$PROJECT_DIR/DEPLOY_SHA" 2>/dev/null || true

            echo ""
            echo "Deploy Time:"
            cat "$PROJECT_DIR/DEPLOY_TIME" 2>/dev/null || true

            echo ""
            echo "======================================"

          EOF

      # ==========================================================
      # CLEANUP
      # ==========================================================
      - name: Remove temporary SSH key
        if: always()
        shell: bash
        run: |
          rm -f ~/.ssh/deploy_key