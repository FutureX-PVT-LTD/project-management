name: Deploy Project Management

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Debug repository structure
        run: |
          echo "Current directory:"
          pwd
          echo "Repo root:"
          ls -la
          echo "Backend:"
          ls -la backend
          echo "Frontend:"
          ls -la frontend

      - name: Configure SSH
        run: |
          set -e

          SSH_PORT="${{ secrets.VPS_PORT }}"
          if [ -z "$SSH_PORT" ]; then SSH_PORT=22; fi

          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H -p "$SSH_PORT" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          set -e

          SSH_PORT="${{ secrets.VPS_PORT }}"
          if [ -z "$SSH_PORT" ]; then SSH_PORT=22; fi

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "echo SSH connected && ls -la /var/www/project-management"

      - name: Upload source preserving persistent data
        run: |
          set -e

          SSH_PORT="${{ secrets.VPS_PORT }}"
          if [ -z "$SSH_PORT" ]; then SSH_PORT=22; fi

          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules" \
            --exclude="backend/node_modules" \
            --exclude="frontend/node_modules" \
            --exclude="frontend/.next" \
            --exclude=".env" \
            --exclude="backend/.env" \
            --exclude="frontend/.env" \
            --exclude="frontend/.env.local" \
            --exclude="frontend/.env.production" \
            --exclude="*.log" \
            --exclude="logs" \
            --exclude="uploads" \
            --exclude="backend/uploads" \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/project-management/

      - name: Verify configuration, build and restart
        run: |
          set -e

          SSH_PORT="${{ secrets.VPS_PORT }}"
          if [ -z "$SSH_PORT" ]; then SSH_PORT=22; fi

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e

            echo "Checking runtime..."
            node -v
            npm -v

            corepack enable
            corepack prepare pnpm@12.3.4 --activate
            pnpm -v

            cd /var/www/project-management

            echo "Writing clean pnpm workspace config..."
            rm -f pnpm-workspace.yaml
            printf '%s\n' \
              'packages:' \
              '  - "."' \
              '  - "backend"' \
              '  - "frontend"' \
              '' \
              'onlyBuiltDependencies:' \
              '  - "@nestjs/core"' \
              '  - "@prisma/client"' \
              '  - "@prisma/engines"' \
              '  - "@scarf/scarf"' \
              '  - "argon2"' \
              '  - "prisma"' \
              '  - "esbuild"' \
              '  - "sharp"' \
              '  - "unrs-resolver"' \
              '' \
              'dangerouslyAllowAllBuilds: true' \
              > pnpm-workspace.yaml

            printf '%s\n' \
              'dangerously-allow-all-builds=true' \
              'ignore-scripts=false' \
              > .npmrc

            echo "Checking backend env..."
            if [ ! -f /var/www/project-management/backend/.env ]; then
              echo "ERROR: backend/.env not found"
              exit 1
            fi

            echo "Checking required backend env values..."
            cd /var/www/project-management/backend

            if ! grep -q '^DATABASE_URL=' .env; then
              echo "ERROR: DATABASE_URL missing in backend/.env"
              exit 1
            fi

            if ! grep -q '^JWT_SECRET=' .env; then
              echo "ERROR: JWT_SECRET missing in backend/.env"
              exit 1
            fi

            if ! grep -q '^JWT_ACCESS_SECRET=' .env; then
              echo "ERROR: JWT_ACCESS_SECRET missing in backend/.env"
              exit 1
            fi

            if ! grep -q '^JWT_REFRESH_SECRET=' .env; then
              echo "ERROR: JWT_REFRESH_SECRET missing in backend/.env"
              exit 1
            fi

            echo "Ensuring HTTP cookie config..."
            grep -q '^COOKIE_SECURE=' .env || echo 'COOKIE_SECURE=false' >> .env
            grep -q '^COOKIE_SAME_SITE=' .env || echo 'COOKIE_SAME_SITE=lax' >> .env
            grep -q '^COOKIE_DOMAIN=' .env || echo 'COOKIE_DOMAIN=' >> .env

            echo "Applying auth cookie secure fix..."
            sed -i "s/secure: process.env.NODE_ENV === 'production'/secure: process.env.COOKIE_SECURE === 'true'/g" src/modules/auth/auth.controller.ts || true

            echo "Backend install..."
            export PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS=true
            export PNPM_CONFIG_IGNORE_SCRIPTS=false

            cd /var/www/project-management
            pnpm install

            echo "Backend prisma and build..."
            cd /var/www/project-management/backend
            pnpm exec prisma generate
            pnpm exec prisma db push
            pnpm run build

            echo "Restarting backend..."
            pm2 delete project-management-api 2>/dev/null || true
            pm2 start pnpm \
              --name project-management-api \
              --cwd /var/www/project-management/backend \
              -- run start:prod

            echo "Writing frontend env..."
            cd /var/www/project-management/frontend
            cat > .env.production << 'FEOF'
            API_URL=http://127.0.0.1:5040
            NEXT_PUBLIC_API_BASE_URL=/api/v1
            NEXT_PUBLIC_API_URL=/api/v1
            NEXT_PUBLIC_BACKEND_URL=/api/v1
            NEXT_PUBLIC_APP_URL=http://159.65.128.70:8094
            FEOF

            echo "Frontend build..."
            cd /var/www/project-management/frontend
            rm -rf .next

            export API_URL=http://127.0.0.1:5040
            export NEXT_PUBLIC_API_BASE_URL=/api/v1
            export NEXT_PUBLIC_API_URL=/api/v1
            export NEXT_PUBLIC_BACKEND_URL=/api/v1
            export NEXT_PUBLIC_APP_URL=http://159.65.128.70:8094
            export NEXT_TELEMETRY_DISABLED=1
            export NODE_OPTIONS="--max-old-space-size=1024"

            pnpm run build

            if [ ! -f .next/BUILD_ID ]; then
              echo "ERROR: Next.js build failed. .next/BUILD_ID not found"
              exit 1
            fi

            echo "Restarting frontend..."
            pm2 delete project-management-frontend 2>/dev/null || true

            API_URL=http://127.0.0.1:5040 pm2 start /var/www/project-management/frontend/node_modules/next/dist/bin/next \
              --name project-management-frontend \
              --cwd /var/www/project-management/frontend \
              -- start -p 3040 -H 127.0.0.1

            pm2 save

            echo "Reloading nginx..."
            nginx -t
            systemctl reload nginx

            echo "Checking deployment..."
            pm2 list
            curl -i http://127.0.0.1:5040/api/v1/health || true
            curl -I http://127.0.0.1:3040 || true
            curl -I http://127.0.0.1:8094 || true

            echo "Project Management deployment completed."
          EOF
