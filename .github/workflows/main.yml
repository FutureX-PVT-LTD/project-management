name: Deploy Project Management

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Debug repository structure
        run: |
          pwd
          ls -la
          ls -la backend
          ls -la frontend

      - name: Configure SSH
        run: |
          set -e

          SSH_PORT="${{ secrets.VPS_PORT }}"
          if [ -z "$SSH_PORT" ]; then SSH_PORT=22; fi

          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H -p "$SSH_PORT" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          set -e

          SSH_PORT="${{ secrets.VPS_PORT }}"
          if [ -z "$SSH_PORT" ]; then SSH_PORT=22; fi

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "echo SSH connected && ls -la /var/www/project-management"

      - name: Upload source
        run: |
          set -e

          SSH_PORT="${{ secrets.VPS_PORT }}"
          if [ -z "$SSH_PORT" ]; then SSH_PORT=22; fi

          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules" \
            --exclude="backend/node_modules" \
            --exclude="frontend/node_modules" \
            --exclude="frontend/.next" \
            --exclude=".env" \
            --exclude="backend/.env" \
            --exclude="frontend/.env" \
            --exclude="frontend/.env.local" \
            --exclude="frontend/.env.production" \
            --exclude="uploads" \
            --exclude="backend/uploads" \
            --exclude="*.log" \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/project-management/

      - name: Build and restart
        run: |
          set -e

          SSH_PORT="${{ secrets.VPS_PORT }}"
          if [ -z "$SSH_PORT" ]; then SSH_PORT=22; fi

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e

            node -v
            npm -v

            corepack enable
            corepack prepare pnpm@latest --activate
            pnpm -v

            cd /var/www/project-management

            rm -f pnpm-workspace.yaml .npmrc

            printf '%s\n' \
            'packages:' \
            '  - "."' \
            '  - "backend"' \
            '  - "frontend"' \
            '' \
            'allowBuilds:' \
            '  "@nestjs/core": true' \
            '  "@prisma/client": true' \
            '  "@prisma/engines": true' \
            '  "@scarf/scarf": true' \
            '  argon2: true' \
            '  prisma: true' \
            '  esbuild: true' \
            '  sharp: true' \
            '  unrs-resolver: true' \
            > pnpm-workspace.yaml

            printf '%s\n' \
            'dangerously-allow-all-builds=true' \
            'ignore-scripts=false' \
            > .npmrc

            echo "Backend deploy..."
            cd /var/www/project-management/backend

            if [ ! -f .env ]; then
              echo "ERROR: backend/.env missing on server"
              exit 1
            fi

            grep -q '^ALLOW_HTTP_ORIGINS=' .env || echo 'ALLOW_HTTP_ORIGINS=true' >> .env
            grep -q '^COOKIE_SECURE=' .env || echo 'COOKIE_SECURE=false' >> .env
            grep -q '^COOKIE_SAMESITE=' .env || echo 'COOKIE_SAMESITE=lax' >> .env

            sed -i "s/secure: process.env.NODE_ENV === 'production'/secure: process.env.COOKIE_SECURE === 'true'/g" src/modules/auth/auth.controller.ts || true

            cd /var/www/project-management
            pnpm install

            cd /var/www/project-management/backend
            pnpm exec prisma generate
            pnpm exec prisma db push
            pnpm run build

            MAIN_FILE=$(find dist -type f -name "main.js" | head -n 1)

            if [ -z "$MAIN_FILE" ]; then
              echo "ERROR: backend main.js not found in dist"
              exit 1
            fi

            echo "Starting backend with $MAIN_FILE"

            pm2 delete project-management-api 2>/dev/null || true

            PORT=5040 NODE_ENV=production pm2 start "$MAIN_FILE" \
              --name project-management-api \
              --cwd /var/www/project-management/backend \
              --update-env

            echo "Frontend deploy..."
            cd /var/www/project-management/frontend

            cat > .env.production << 'FEOF'
            API_URL=http://127.0.0.1:5040
            NEXT_PUBLIC_API_BASE_URL=/api/v1
            NEXT_PUBLIC_API_URL=/api/v1
            NEXT_PUBLIC_BACKEND_URL=/api/v1
            NEXT_PUBLIC_APP_URL=https://projects.futurex.lk
            FEOF

            rm -rf .next

            export API_URL=http://127.0.0.1:5040
            export NEXT_PUBLIC_API_BASE_URL=/api/v1
            export NEXT_PUBLIC_API_URL=/api/v1
            export NEXT_PUBLIC_BACKEND_URL=/api/v1
            export NEXT_PUBLIC_APP_URL=https://projects.futurex.lk
            export NEXT_TELEMETRY_DISABLED=1
            export NODE_OPTIONS="--max-old-space-size=1024"

            pnpm run build

            if [ ! -f .next/BUILD_ID ]; then
              echo "ERROR: frontend .next/BUILD_ID not found"
              exit 1
            fi

            pm2 delete project-management-frontend 2>/dev/null || true

            API_URL=http://127.0.0.1:5040 pm2 start /var/www/project-management/frontend/node_modules/next/dist/bin/next \
              --name project-management-frontend \
              --cwd /var/www/project-management/frontend \
              -- start -p 3040 -H 127.0.0.1

            pm2 save

            nginx -t
            systemctl reload nginx

            curl -f http://127.0.0.1:5040/api/v1/health
            curl -f -I http://127.0.0.1:3040

            echo "Deployment completed successfully."
          EOF