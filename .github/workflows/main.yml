name: Deploy Project Management

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: futurex-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Configure verified SSH
        shell: bash
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Missing VPS_HOST}"
          : "${VPS_USER:?Missing VPS_USER}"
          : "${VPS_SSH_KEY:?Missing VPS_SSH_KEY}"
          : "${VPS_KNOWN_HOSTS:?Set independently verified VPS_KNOWN_HOSTS}"
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$VPS_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "${VPS_PORT:-22}" =~ ^[0-9]{1,5}$ ]]
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" \
            "$VPS_USER@$VPS_HOST" 'test -d /var/www/project-management'

      - name: Upload source
        shell: bash
        run: |
          set -euo pipefail
          rsync -az --delete \
            -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i $HOME/.ssh/deploy_key -p ${VPS_PORT:-22}" \
            --exclude='.git' --exclude='.github' --exclude='node_modules' \
            --exclude='.next' --exclude='.next-dev' --exclude='dist' \
            --exclude='.env*' --exclude='uploads' --exclude='logs' --exclude='scratch' --exclude='*.log' \
            ./ "$VPS_USER@$VPS_HOST:/var/www/project-management/"

      - name: Validate build migrate and restart
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /var/www/project-management
          test -f backend/.env
          test -f frontend/.env.production
          node -v
          corepack prepare pnpm@11.19.0 --activate
          export NODE_ENV=production NEXT_TELEMETRY_DISABLED=1
          corepack pnpm install --frozen-lockfile --prod=false
          cd backend
          corepack pnpm exec prisma generate
          corepack pnpm run typecheck
          NODE_ENV=test corepack pnpm run test --runInBand
          corepack pnpm run build
          node -r dotenv/config -e "require('./dist/common/security/http-security').validateSecurityEnvironment(); const s=require('./dist/modules/auth/auth-secrets'); s.getJwtAccessSecret(); s.getJwtRefreshSecret();"
          cd ../frontend
          corepack pnpm run test:calendar
          export API_URL=http://127.0.0.1:5040 NEXT_PUBLIC_API_URL=/api/v1
          export NODE_OPTIONS=--max-old-space-size=1024
          corepack pnpm run build
          test -f .next/BUILD_ID
          unset NODE_OPTIONS
          cd ../backend
          # Existing databases created with db push require a reviewed migration baseline first.
          corepack pnpm exec prisma migrate deploy
          node scripts/check-production.cjs
          cd ..
          nginx -t
          pm2 startOrReload deploy/ecosystem.config.cjs --env production --update-env
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 2 --max-time 5 --output /dev/null http://127.0.0.1:5040/api/v1/health
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 2 --max-time 5 --output /dev/null http://127.0.0.1:3040/login
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 2 --max-time 5 --output /dev/null http://127.0.0.1:3040/api/v1/health
          pm2 save
          systemctl reload nginx
          echo 'Build, migration and upstream checks passed; external HTTPS checks remain required.'
          REMOTE

      - name: Remove temporary SSH key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/deploy_key
